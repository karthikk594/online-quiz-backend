# ──────────────────────────────────────────────────────────────────────
# application-prod.properties
# Loaded ONLY when SPRING_PROFILES_ACTIVE=prod (i.e. on Railway).
# Local dev still uses application.properties (H2).
# ──────────────────────────────────────────────────────────────────────

# Railway injects these three variables automatically
# when you add a PostgreSQL database to your project.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' = keep existing data, only add new columns when entities change
spring.jpa.hibernate.ddl-auto=update

# Turn off verbose SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 console — not needed in production
spring.h2.console.enabled=false

# Use PORT env variable provided by Railway (default 8080)
server.port=${PORT:8080}
