# ──────────────────────────────────────────────────────────────────────
# Online Quiz - Spring Boot Application Properties
# ──────────────────────────────────────────────────────────────────────

# Server port (default is 8080)
server.port=8080

# ──────────────────────────────────────────────────────────────────────
# H2 In-Memory Database Configuration
# ──────────────────────────────────────────────────────────────────────

# JDBC URL for H2 (in-memory mode — data is lost when app stops)
spring.datasource.url=jdbc:h2:mem:quizdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ──────────────────────────────────────────────────────────────────────
# JPA / Hibernate Settings
# ──────────────────────────────────────────────────────────────────────

# 'create-drop' means: create tables on startup, drop them on shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Show generated SQL queries in the console (useful for learning/debugging)
spring.jpa.show-sql=true

# Pretty-print the SQL
spring.jpa.properties.hibernate.format_sql=true

# Use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ──────────────────────────────────────────────────────────────────────
# H2 Console (browser-based database viewer)
# Access at: http://localhost:8080/h2-console
# JDBC URL to enter in the console: jdbc:h2:mem:quizdb
# ──────────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
